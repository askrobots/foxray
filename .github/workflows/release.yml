# Tests on every push and pull request; on a version tag (v0.1.1, ...) also
# builds the sdist and wheel and uploads them to PyPI with twine.
#
# Needs the repository secret PYPI_API_TOKEN (Settings > Secrets and variables >
# Actions) holding a PyPI API token, e.g. one scoped to the foxray project.
name: CI and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            django: "Django>=4.2,<5"
          - python-version: "3.12"
            django: "Django>=5.2,<6"
          - python-version: "3.14"
            django: "Django>=5.2,<6"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      FOXRAY_TEST_PG_URL: postgres://postgres:postgres@localhost:5432/postgres
      FOXRAY_TEST_DJANGO_PG: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[postgres,brotli]" pytest pytest-django "sentry-sdk>=2" "${{ matrix.django }}"
      - name: Test
        run: pytest

  publish:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine
      - name: The tag matches the version in pyproject.toml
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} but pyproject says ${version}"; exit 1; }
      - name: Build
        run: python -m build
      - name: Check
        run: twine check --strict dist/*
      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload --skip-existing dist/*  # a manual upload of this version already done is fine
