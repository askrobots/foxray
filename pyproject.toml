[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "foxray"
version = "0.1.0"
description = "A light error tracker that accepts errors from the Sentry SDKs. Works as a Django app or a single small process."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Dan Quellhorst"}]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
]
dependencies = []

[project.optional-dependencies]
django = ["Django>=4.2"]
postgres = ["psycopg>=3.1"]
brotli = ["Brotli"]
dev = ["pytest", "pytest-django", "sentry-sdk>=2", "Django>=4.2,<5"]

[project.scripts]
foxray = "foxray.standalone.cli:main"

[tool.setuptools.packages.find]
include = ["foxray*"]

[tool.setuptools.package-data]
"foxray.django" = ["templates/**/*.html"]
